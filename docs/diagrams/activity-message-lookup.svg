="249.095" y="158.584" fill="#000" font-size="12" textLength="102.756" font-family="'DejaVu Sans'">inside a request?</text><rect x="207.311" y="200.398" width="186.324" height="33.969" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="4" ry="4"/><text x="217.311" y="221.537" fill="#000" font-size="12" textLength="166.324" font-family="'DejaVu Sans'">use the request's translator</text><polygon points="425.635,142.43,649.527,142.43,661.527,154.43,649.527,166.43,425.635,166.43,413.635,154.43,425.635,142.43" fill="#FFF" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="541.581" y="177.568" fill="#000" font-size="12" textLength="20.736" font-family="'DejaVu Sans'">yes</text><text x="425.635" y="158.584" fill="#000" font-size="12" textLength="223.893" font-family="'DejaVu Sans'">a process default Localization exists?</text><text x="661.527" y="151.6" fill="#000" font-size="12" textLength="14.947" font-family="'DejaVu Sans'">no</text><rect x="433.887" y="200.398" width="207.389" height="33.969" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="4" ry="4"/><text x="443.887" y="221.537" fill="#000" font-size="12" textLength="187.389" font-family="'DejaVu Sans'">use its default-locale translator</text><rect x="681.527" y="181.922" width="241.145" height="33.969" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="4" ry="4"/><text x="691.527" y="203.061" fill="#000" font-size="12" textLength="221.145" font-family="'DejaVu Sans'">raise LocalizationNotConfiguredError</text><ellipse cx="802.1" cy="261.891" rx="11" ry="11" fill="none" style="stroke:#000;stroke-width:1;"/><ellipse cx="802.1" cy="261.891" rx="6" ry="6" fill="#FFF" style="stroke:#000;stroke-width:1;"/><path d="M650.692,302.891 L650.692,338.813 L630.692,342.813 L650.692,346.813 L650.692,382.734 A0,0 0 0 0 650.692,382.734 L862.731,382.734 A0,0 0 0 0 862.731,382.734 L862.731,312.891 L852.731,302.891 L650.692,302.891 A0,0 0 0 0 650.692,302.891" style="stroke:#C8B560;stroke-width: