      - Setup: reference/setup.md
      - Translation: reference/translation.md
      - Locale context: reference/context.md
      - Lazy text: reference/lazy.md
      - Dependencies: reference/dependencies.md
      - Locale sources: reference/sources.md
      - Errors and exceptions: reference/errors.md
      - Testing: reference/testing.md
  - Project documents:
