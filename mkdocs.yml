site_name: fastapi-locale
site_description: Internationalization for FastAPI with gettext catalogs
# Read the Docs sets the canonical URL of each version; local builds fall back to the latest one.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://fastapi-locale.readthedocs.io/en/latest/"]
repo_url: https://github.com/fastapi-extensions/fastapi-locale
repo_name: fastapi-extensions/fastapi-locale
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  icon:
    logo: material/translate
  favicon: assets/favicon.svg
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

copyright: Copyright &copy; 2026 fastapi-locale contributors. MIT License.

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fastapi-extensions/fastapi-locale
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fastapi-locale/

exclude_docs: |
  diagrams/*.puml
  diagrams/include/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            members_order: source
            signature_crossrefs: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
      - Tutorial: getting-started/tutorial.md
  - User guide:
      - Configuration: guide/configuration.md
      - Translating messages: guide/translating.md
      - Lazy text: guide/lazy-text.md
      - Choosing the locale: guide/locale-resolution.md
      - The user's saved language: guide/user-language.md
      - Validation errors: guide/validation-errors.md
      - API documentation: guide/api-documentation.md
      - Testing: guide/testing.md
      - Command line tool: guide/command-line.md
      - Deployment: guide/deployment.md
      - Troubleshooting: guide/troubleshooting.md
      - Migrating: guide/migration.md
  - API reference:
