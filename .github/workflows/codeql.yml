name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 3"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning on private repositories needs GitHub Advanced Security; runs once public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python, actions
      - uses: github/codeql-action/analyze@v4
